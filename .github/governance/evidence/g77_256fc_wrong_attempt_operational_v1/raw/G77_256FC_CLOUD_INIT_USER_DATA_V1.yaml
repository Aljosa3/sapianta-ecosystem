#cloud-config
users: []
disable_root: false
ssh_pwauth: false
runcmd:
  - |
    set -eu
    export PYTHONDONTWRITEBYTECODE=1
    mkdir -p /mnt/aigol /mnt/dp-harness /mnt/g77-harness /mnt/g77-evidence
    mount -t 9p -o trans=virtio,version=9p2000.L,ro aigol_checkout /mnt/aigol
    mount -t 9p -o trans=virtio,version=9p2000.L,ro dp_harness /mnt/dp-harness
    mount -t 9p -o trans=virtio,version=9p2000.L,ro g77_harness /mnt/g77-harness
    mount -t 9p -o trans=virtio,version=9p2000.L g77_evidence /mnt/g77-evidence
    echo G77_256FC_BOOT_MARKER=PASS
    set +e
    /usr/bin/python3 /mnt/dp-harness/G77_256FC_WRONG_ATTEMPT_VECTOR_ADAPTER_V1.py ef564f54fc764ed3968d94365a56a09f06025ea1f534c4a08f818183ddef2e8d 95ca9b753b2e4256b6530652d5a6e2a8220fed68c52f774928e1e39721f4ca67 f2626906b9a95631d921e6bb9a6947400c03a028 977a5a5a43350dbe2270778a806dd20d6a31e87b 4e5d01699796d4bb451818408f7cd6a080b6d55fde518df8a9dd2acd3f1a73bb
    fc_status=$?
    set -e
    echo G77_256FC_HARNESS_EXIT_STATUS=$fc_status
    sync
    poweroff -f
