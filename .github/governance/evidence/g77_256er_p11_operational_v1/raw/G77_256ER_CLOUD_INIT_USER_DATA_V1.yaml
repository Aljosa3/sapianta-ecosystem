#cloud-config
users: []
disable_root: false
ssh_pwauth: false
runcmd:
  - |
    set -eu
    export PYTHONDONTWRITEBYTECODE=1
    mkdir -p /mnt/aigol /mnt/dp-harness /mnt/g77-harness /mnt/g77-evidence
    mount -t 9p -o trans=virtio,version=9p2000.L,ro aigol_checkout /mnt/aigol
    mount -t 9p -o trans=virtio,version=9p2000.L,ro dp_harness /mnt/dp-harness
    mount -t 9p -o trans=virtio,version=9p2000.L,ro g77_harness /mnt/g77-harness
    mount -t 9p -o trans=virtio,version=9p2000.L g77_evidence /mnt/g77-evidence
    echo G77_256ER_BOOT_MARKER=PASS
    set +e
    /usr/bin/python3 /mnt/dp-harness/G77_256ER_P11_OPERATIONAL_HARNESS_V1.py 4a2a84ff83c61bfec013b4bcd20eb16905eeb240869182edd6c0d948444bae89 95ca9b753b2e4256b6530652d5a6e2a8220fed68c52f774928e1e39721f4ca67 574b1c02f64df3c586ee4ad7214e2f677edf2dc3 f6a66f07785ec3a825311a796f0e8e6fd1fc3408 4e5d01699796d4bb451818408f7cd6a080b6d55fde518df8a9dd2acd3f1a73bb
    dp_status=$?
    set -e
    echo G77_256ER_HARNESS_EXIT_STATUS=$dp_status
    sync
    poweroff -f
