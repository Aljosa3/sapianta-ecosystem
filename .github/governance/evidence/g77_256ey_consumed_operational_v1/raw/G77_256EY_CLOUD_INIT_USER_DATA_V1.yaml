#cloud-config
users: []
disable_root: false
ssh_pwauth: false
runcmd:
  - |
    set -eu
    export PYTHONDONTWRITEBYTECODE=1
    mkdir -p /mnt/aigol /mnt/dp-harness /mnt/g77-harness /mnt/g77-evidence
    mount -t 9p -o trans=virtio,version=9p2000.L,ro aigol_checkout /mnt/aigol
    mount -t 9p -o trans=virtio,version=9p2000.L,ro dp_harness /mnt/dp-harness
    mount -t 9p -o trans=virtio,version=9p2000.L,ro g77_harness /mnt/g77-harness
    mount -t 9p -o trans=virtio,version=9p2000.L g77_evidence /mnt/g77-evidence
    echo G77_256EY_BOOT_MARKER=PASS
    set +e
    /usr/bin/python3 /mnt/dp-harness/G77_256EY_CONSUMED_VECTOR_ADAPTER_V1.py d56c48cb93e6e174fade9d18c843f4c64924f360441da7e61794ab0447f34823 95ca9b753b2e4256b6530652d5a6e2a8220fed68c52f774928e1e39721f4ca67 de2fcd66f61e3263e243949f18b0a2cef3a94f8b e06cfcff68c63db691587167bad6bb5410f104ac 4e5d01699796d4bb451818408f7cd6a080b6d55fde518df8a9dd2acd3f1a73bb
    ey_status=$?
    set -e
    echo G77_256EY_HARNESS_EXIT_STATUS=$ey_status
    sync
    poweroff -f
