#cloud-config
users: []
disable_root: false
ssh_pwauth: false
runcmd:
  - |
    set -eu
    export PYTHONDONTWRITEBYTECODE=1
    mkdir -p /mnt/aigol /mnt/dp-harness /mnt/g77-harness /mnt/g77-evidence
    mount -t 9p -o trans=virtio,version=9p2000.L,ro aigol_checkout /mnt/aigol
    mount -t 9p -o trans=virtio,version=9p2000.L,ro dp_harness /mnt/dp-harness
    mount -t 9p -o trans=virtio,version=9p2000.L,ro g77_harness /mnt/g77-harness
    mount -t 9p -o trans=virtio,version=9p2000.L g77_evidence /mnt/g77-evidence
    echo G77_256EJ_BOOT_MARKER=PASS
    set +e
    /usr/bin/python3 /mnt/dp-harness/G77_256EJ_P11_OPERATIONAL_HARNESS_V1.py d978d9b6714f12be4f4ddff03bd9bc1ffc6ddf27f46e361595e0efe6a40e7105 cb9d7f2313d1c0645ff6665b3e9544e6bdd8603606b93709001ed7ad750d0a25 0d9b72facc30fd4ade8046607c8fb3244ba4a517 9e97364af99784020217ecf5f743f8822195e59d 4e5d01699796d4bb451818408f7cd6a080b6d55fde518df8a9dd2acd3f1a73bb
    harness_status=$?
    set -e
    echo G77_256EJ_HARNESS_EXIT_STATUS=$harness_status
    sync
    poweroff -f
