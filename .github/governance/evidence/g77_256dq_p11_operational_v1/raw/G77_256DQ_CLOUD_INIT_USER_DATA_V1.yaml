#cloud-config
users: []
disable_root: false
ssh_pwauth: false
runcmd:
  - |
    set -eu
    export PYTHONDONTWRITEBYTECODE=1
    mkdir -p /mnt/aigol /mnt/dp-harness /mnt/g77-harness /mnt/g77-evidence
    mount -t 9p -o trans=virtio,version=9p2000.L,ro aigol_checkout /mnt/aigol
    mount -t 9p -o trans=virtio,version=9p2000.L,ro dp_harness /mnt/dp-harness
    mount -t 9p -o trans=virtio,version=9p2000.L,ro g77_harness /mnt/g77-harness
    mount -t 9p -o trans=virtio,version=9p2000.L g77_evidence /mnt/g77-evidence
    echo G77_256DQ_BOOT_MARKER=PASS
    set +e
    /usr/bin/python3 /mnt/dp-harness/G77_256DQ_P11_OPERATIONAL_HARNESS_V1.py f045451bb5d6ec42a66081cca816593d9af6c0ef44ce56882182352539d182c6 7fe68ca7eacd195fc075715157808de539e02d3a08406578227ed71bb110dea3 c01247850bf542ec86232791576381437ca71c38 9704d36671b77757a3c4e8df72fad0bcb177a359 4e5d01699796d4bb451818408f7cd6a080b6d55fde518df8a9dd2acd3f1a73bb
    dp_status=$?
    set -e
    echo G77_256DQ_HARNESS_EXIT_STATUS=$dp_status
    sync
    poweroff -f

