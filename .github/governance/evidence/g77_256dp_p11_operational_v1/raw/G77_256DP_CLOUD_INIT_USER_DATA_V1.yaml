#cloud-config
users: []
disable_root: false
ssh_pwauth: false
runcmd:
  - |
    set -eu
    export PYTHONDONTWRITEBYTECODE=1
    mkdir -p /mnt/aigol /mnt/dp-harness /mnt/g77-harness /mnt/g77-evidence
    mount -t 9p -o trans=virtio,version=9p2000.L,ro aigol_checkout /mnt/aigol
    mount -t 9p -o trans=virtio,version=9p2000.L,ro dp_harness /mnt/dp-harness
    mount -t 9p -o trans=virtio,version=9p2000.L,ro g77_harness /mnt/g77-harness
    mount -t 9p -o trans=virtio,version=9p2000.L g77_evidence /mnt/g77-evidence
    echo G77_256DP_BOOT_MARKER=PASS
    set +e
    /usr/bin/python3 /mnt/dp-harness/G77_256DP_P11_OPERATIONAL_HARNESS_V1.py 049b9e1d78f34ef29f4fe3f5c0cdb2d79505949336256c7f37820926f12c2208 b82fbdd58de2376c9cb52a9a703d2d84af9d30ccbe43620fe6ef4ead2bede53d 475088942b83cde3806025df00995effb310108a 29617d4b2e6c7b6e41c89907a2b2e27374e4ca91 4e5d01699796d4bb451818408f7cd6a080b6d55fde518df8a9dd2acd3f1a73bb
    dp_status=$?
    set -e
    echo G77_256DP_HARNESS_EXIT_STATUS=$dp_status
    sync
    poweroff -f

