#cloud-config
users: []
disable_root: false
ssh_pwauth: false
runcmd:
  - |
    set -eu
    export PYTHONDONTWRITEBYTECODE=1
    mkdir -p /mnt/aigol /mnt/dp-harness /mnt/g77-harness /mnt/g77-evidence
    mount -t 9p -o trans=virtio,version=9p2000.L,ro aigol_checkout /mnt/aigol
    mount -t 9p -o trans=virtio,version=9p2000.L,ro dp_harness /mnt/dp-harness
    mount -t 9p -o trans=virtio,version=9p2000.L,ro g77_harness /mnt/g77-harness
    mount -t 9p -o trans=virtio,version=9p2000.L g77_evidence /mnt/g77-evidence
    echo G77_256FA_BOOT_MARKER=PASS
    set +e
    /usr/bin/python3 /mnt/dp-harness/G77_256FA_CONSUMED_VECTOR_ADAPTER_V1.py c6e311d383e218c3e22859b8fa026011254a961e35229960a15a97fc6db3e3fc 95ca9b753b2e4256b6530652d5a6e2a8220fed68c52f774928e1e39721f4ca67 7297f014ec8ba0940bbe08994a5e48f00e0bb059 c1ad5878e05c8002cb806a5934108d65ca1efde7 4e5d01699796d4bb451818408f7cd6a080b6d55fde518df8a9dd2acd3f1a73bb
    fa_status=$?
    set -e
    echo G77_256FA_HARNESS_EXIT_STATUS=$fa_status
    sync
    poweroff -f
