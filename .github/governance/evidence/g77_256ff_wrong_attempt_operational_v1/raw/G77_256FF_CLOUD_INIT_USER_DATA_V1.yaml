#cloud-config
users: []
disable_root: false
ssh_pwauth: false
runcmd:
  - |
    set -eu
    export PYTHONDONTWRITEBYTECODE=1
    mkdir -p /mnt/aigol /mnt/dp-harness /mnt/g77-harness /mnt/g77-evidence
    mount -t 9p -o trans=virtio,version=9p2000.L,ro aigol_checkout /mnt/aigol
    mount -t 9p -o trans=virtio,version=9p2000.L,ro dp_harness /mnt/dp-harness
    mount -t 9p -o trans=virtio,version=9p2000.L,ro g77_harness /mnt/g77-harness
    mount -t 9p -o trans=virtio,version=9p2000.L g77_evidence /mnt/g77-evidence
    echo G77_256FF_BOOT_MARKER=PASS
    set +e
    /usr/bin/python3 /mnt/dp-harness/G77_256FF_WRONG_ATTEMPT_VECTOR_ADAPTER_V1.py b63a2e622f2c069a97863176e87e6255fac37ad61edcb44e6a201f033127a323 95ca9b753b2e4256b6530652d5a6e2a8220fed68c52f774928e1e39721f4ca67 92ccdedb2d846c91878bf7a5b2ac958c547d60a1 7cf4ab8dc22849db2445a80bf9e1dcae639747b0 4e5d01699796d4bb451818408f7cd6a080b6d55fde518df8a9dd2acd3f1a73bb
    ff_status=$?
    set -e
    echo G77_256FF_HARNESS_EXIT_STATUS=$ff_status
    sync
    poweroff -f
