#cloud-config
users: []
disable_root: false
ssh_pwauth: false
runcmd:
  - |
    set -eu
    export PYTHONDONTWRITEBYTECODE=1
    mkdir -p /mnt/aigol /mnt/dp-harness /mnt/g77-harness /mnt/g77-evidence
    mount -t 9p -o trans=virtio,version=9p2000.L,ro aigol_checkout /mnt/aigol
    mount -t 9p -o trans=virtio,version=9p2000.L,ro dp_harness /mnt/dp-harness
    mount -t 9p -o trans=virtio,version=9p2000.L,ro g77_harness /mnt/g77-harness
    mount -t 9p -o trans=virtio,version=9p2000.L g77_evidence /mnt/g77-evidence
    echo G77_256DT_BOOT_MARKER=PASS
    set +e
    /usr/bin/python3 /mnt/dp-harness/G77_256DT_P11_OPERATIONAL_HARNESS_V1.py 6eb7a97686fd0846563d63c916d38b313dc6b824c82132b97be0f2df5c8038b2 703248f30b7247b66f2a0a180678c064a6bf64512ace6fef7ad0739eddd0ba08 dc030b8d8c113f5176d3f92f19482ee7a0a54a47 df2e03ba896f705e679a8e7f41a514d2c640da57 4e5d01699796d4bb451818408f7cd6a080b6d55fde518df8a9dd2acd3f1a73bb
    dp_status=$?
    set -e
    echo G77_256DT_HARNESS_EXIT_STATUS=$dp_status
    sync
    poweroff -f

