#cloud-config
users: []
disable_root: false
ssh_pwauth: false
runcmd:
  - |
    set -eu
    export PYTHONDONTWRITEBYTECODE=1
    mkdir -p /mnt/aigol /mnt/dp-harness /mnt/g77-harness /mnt/g77-evidence
    mount -t 9p -o trans=virtio,version=9p2000.L,ro aigol_checkout /mnt/aigol
    mount -t 9p -o trans=virtio,version=9p2000.L,ro dp_harness /mnt/dp-harness
    mount -t 9p -o trans=virtio,version=9p2000.L,ro g77_harness /mnt/g77-harness
    mount -t 9p -o trans=virtio,version=9p2000.L g77_evidence /mnt/g77-evidence
    echo G77_256DR_BOOT_MARKER=PASS
    set +e
    /usr/bin/python3 /mnt/dp-harness/G77_256DR_P11_OPERATIONAL_HARNESS_V1.py d7aeaf3b4d989f9d4e404993844d81c6e91d12f294da270a9481d9b85f8a23e5 4982734a2e2e3288dda707062db0191cf3440f912079ad166e086d9ccc7ed740 9a85057d546a3fb33fecce9b6eab8b6c1d38f9c1 66360dad89661b26636da7fcd0bf7640b562db95 4e5d01699796d4bb451818408f7cd6a080b6d55fde518df8a9dd2acd3f1a73bb
    dp_status=$?
    set -e
    echo G77_256DR_HARNESS_EXIT_STATUS=$dp_status
    sync
    poweroff -f

