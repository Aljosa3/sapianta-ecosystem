#cloud-config
# G77-256LG preauthorization-only WRONG_SCOPE bootstrap. It invokes the
# operation-local projection of the existing FM adapter entrypoint; it does not
# contain or create Human operational authority.
users: []
disable_root: false
ssh_pwauth: false
runcmd:
  - |
    set -eu
    export PYTHONDONTWRITEBYTECODE=1
    mkdir -p /mnt/aigol /mnt/dp-harness /mnt/g77-harness /mnt/g77-evidence
    mount -t 9p -o trans=virtio,version=9p2000.L,ro aigol_checkout /mnt/aigol
    mount -t 9p -o trans=virtio,version=9p2000.L,ro fm_harness /mnt/dp-harness
    mount -t 9p -o trans=virtio,version=9p2000.L,ro g77_harness /mnt/g77-harness
    mount -t 9p -o trans=virtio,version=9p2000.L g77_evidence /mnt/g77-evidence
    echo G77_256FM_BOOT_MARKER=PASS
    set +e
    /usr/bin/python3 /mnt/dp-harness/G77_256FM_WRONG_ATTEMPT_VECTOR_ADAPTER_V1.py 67847030651e8add82dd16bc8741ad0d81f44c7ba873689a521aea85f2ec4949 95ca9b753b2e4256b6530652d5a6e2a8220fed68c52f774928e1e39721f4ca67 5cdc56046b79b577842f1dedff1faedf6aaedfa0 687db58ac7e87ac9f03f445299e52de4480a8ed6 4e5d01699796d4bb451818408f7cd6a080b6d55fde518df8a9dd2acd3f1a73bb
    fm_status=$?
    set -e
    echo G77_256FM_HARNESS_EXIT_STATUS=$fm_status
    sync
    poweroff -f
