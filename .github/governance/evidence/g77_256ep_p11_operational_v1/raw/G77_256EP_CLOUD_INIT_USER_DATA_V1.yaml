#cloud-config
users: []
disable_root: false
ssh_pwauth: false
runcmd:
  - |
    set -eu
    export PYTHONDONTWRITEBYTECODE=1
    mkdir -p /mnt/aigol /mnt/dp-harness /mnt/g77-harness /mnt/g77-evidence
    mount -t 9p -o trans=virtio,version=9p2000.L,ro aigol_checkout /mnt/aigol
    mount -t 9p -o trans=virtio,version=9p2000.L,ro dp_harness /mnt/dp-harness
    mount -t 9p -o trans=virtio,version=9p2000.L,ro g77_harness /mnt/g77-harness
    mount -t 9p -o trans=virtio,version=9p2000.L g77_evidence /mnt/g77-evidence
    echo G77_256EP_BOOT_MARKER=PASS
    set +e
    /usr/bin/python3 /mnt/dp-harness/G77_256EP_P11_OPERATIONAL_HARNESS_V1.py 06c26a7d5a77b6961e36af8c82ad9935e544a367c635727e51d67472429a8102 16ce3a3df3484de98bc85375f53eef743216e38d93f1efe64f046184b954e9f6 5306f88ca1cc22e7681a7f042481a69c0a8396cf 61b86737812c528ce68d70ebd52b5372e3c3b193 4e5d01699796d4bb451818408f7cd6a080b6d55fde518df8a9dd2acd3f1a73bb
    dp_status=$?
    set -e
    echo G77_256EP_HARNESS_EXIT_STATUS=$dp_status
    sync
    poweroff -f
